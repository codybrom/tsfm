name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE.md
      - NOTICE
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE.md
      - NOTICE

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx vitest run tests/unit --coverage

  build-dylib:
    # Builds the way publish.yml does: Xcode 27, macOS 27 SDK and deployment target.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Build native dylib from source
        run: |
          rm -f native/libFoundationModels.dylib
          bash scripts/build-native.sh
      - name: Verify dylib
        run: |
          bash scripts/verify-native.sh
          otool -L native/libFoundationModels.dylib
