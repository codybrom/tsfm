name: CI

on:
  push:
    branches: [main, 0.x]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE.md
      - NOTICE
  pull_request:
    branches: [main, 0.x]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE.md
      - NOTICE

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx vitest run tests/unit --coverage

  build-dylib:
    # macos-26 builds against the macOS 26 SDK (no attachments). xcode-27 builds
    # the way publish.yml does: macOS 27 SDK with attachments, still loadable on 26.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            verify-args: ""
          - runner: xcode-27
            verify-args: --attachments
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build native dylib from source
        run: |
          rm -f native/libFoundationModels.dylib
          bash scripts/build-native.sh
      - name: Verify dylib
        run: |
          bash scripts/verify-native.sh ${{ matrix.verify-args }}
          otool -L native/libFoundationModels.dylib
